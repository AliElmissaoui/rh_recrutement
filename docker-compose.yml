

services:
  odoo:
    image: odoo:18.0
    ports:
      - "8069:8069"
    depends_on:
      - postgres
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf
      - ./custom-addons:/mnt/extra-addons
      - ./logs:/var/log/odoo

    command: >
      odoo --config=/etc/odoo/odoo.conf --dev=all
    restart: always  

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_strong_password
    volumes:
      - db-data:/var/lib/postgresql/data
 

volumes:
  odoo-data:
  db-data:
